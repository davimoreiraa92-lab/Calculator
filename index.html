<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1><span>CALCULATOR</span> Made by David</h1>
    </header>

    <Main>
        <div class="calc">

            <div id="display">0</div>

            <div class="buttons" id="buttons">
                <button data-action="clear" class="clear">C</button>
                <button data-action="delete" class="delete">⌫</button>
                <button data-value="÷" class="divided">÷</button>
                <button data-value="x" class="times">x</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-value="-" class="minus">-</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="+" class="plus">+</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-action="equals" class="equals">=</button>

                <button data-value="0" class="zero">0</button>
                <button data-value=".">.</button>
            </div>
        </div>

    </main>

    <script src="js/script.js"></script>


</body>
</html>
